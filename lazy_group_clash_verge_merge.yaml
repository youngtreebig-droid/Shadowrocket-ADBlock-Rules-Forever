# ============================================================================
# Clash Verge Rev 覆写 —「配置覆写(merge)」，由 lazy_group.conf 转换而来
# ============================================================================
# 用法：右键机场订阅卡片 -> "编辑扩展配置"（旧版叫"扩展覆写配置"/Merge），
# 直接是纯 YAML 文本框，粘贴本文件全部内容并保存即可（如原来已有内容，
# 请将其与本文件合并，而不是整份覆盖）。
#
# 本文件只声明 rule-providers（规则集来源），必须与同一订阅的
# "编辑规则"（对应 lazy_group_clash_verge_rules.yaml）和
# "编辑代理组"（对应 lazy_group_clash_verge_groups.yaml）一起应用，
# 三者缺一都会导致规则引用的规则集或策略组缺失。
#
# 规则集已从 Shadowrocket 格式替换为等价的 Clash Meta(mihomo) 格式，主要来自
# blackmatrix7/ios_rule_script 仓库的 rule/Clash/ 目录；AI 规则集默认使用与
# 原 conf 一致的 iab0x00/ProxyRules，如遇部分 AI 服务分流异常，可参照文件
# 末尾注释切换为 blackmatrix7 官方规则集。
#
# 提醒：lazy_group.conf 由本仓库 .github/workflows/release.yml 每天自动从
# 上游重新生成并覆盖，如果上游服务分组/规则集列表变化，本三件套不会自动
# 跟着更新，需要手工同步（这是一次性转换的静态快照）。
# ============================================================================

rule-providers:
  # 广告过滤规则集（blackmatrix7），需放在分流规则最前面以优先拦截广告请求
  ad-blackmatrix7:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.yaml"
    path: ./ruleset/lazy-group/ad-blackmatrix7.yaml
    interval: 86400
  # anti-AD 广告域名集，补充拦截更多广告联盟/横幅/追踪域名（仅域名级拦截）
  ad-antiad:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-clash.yaml"
    path: ./ruleset/lazy-group/ad-antiad.yaml
    interval: 86400
  # MissAV 主站、视频/图片 CDN 和推荐接口
  missav:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/youngtreebig-droid/Shadowrocket-Rules/refs/heads/main/MissAV.list"
    path: ./ruleset/lazy-group/missav.yaml
    interval: 86400
  # AI 服务规则集（与原 conf 默认启用的一致）
  ai:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/iab0x00/ProxyRules/main/Rule/AI.txt"
    path: ./ruleset/lazy-group/ai.yaml
    interval: 86400
