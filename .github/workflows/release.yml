name: Release Shadowrocket Rules

on:
  schedule:
    # 每日8时开始
    - cron:  '0 23 * * *'
  
  push:
    branches:
      - build
    paths-ignore: 
      - '**.md'
      - 'LICENSE'
      
  pull_request_target:
    branches:
      - build
    paths-ignore: 
      - '**.md'
      - 'LICENSE'

  workflow_dispatch:
  
jobs:
  Release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build
          path: build

      - uses: actions/checkout@v4
        with:
          ref: release
          path: release

      - name: Install requirements
        run: pip3 install -r build/requirements.txt

      - name: Build Rules
        run: |
          cd build || exit 1
          ./factory/auto_build.sh
      
      - name: Move files
        run: |
          cd build || exit 1
          cp *.conf ../release/
          cp -r figure ../release/
          cp LICENSE ../release/
          cp readme.md ../release/
      
      - name: Update lazy rules
        run: |
          cd release || exit 1
          rm lazy.conf lazy_group.conf
          curl -O https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy.conf
          curl -O https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy_group.conf
          ad_rule_set='RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Advertising/Advertising.list,REJECT'
          missav_rule_set='RULE-SET,https://raw.githubusercontent.com/youngtreebig-droid/Shadowrocket-Rules/refs/heads/main/MissAV.list,MissAV'
          missav_keyword_rule='DOMAIN-KEYWORD,missav,MissAV'
          kiro_rule_marker='DOMAIN-SUFFIX,kiro.dev,PROXY'
          awk '
            BEGIN {
              groups["AI"] = "AI = select,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["MissAV"] = "MissAV = select,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["YouTube"] = "YouTube = select,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["Netflix"] = "Netflix = select,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["Disney+"] = "Disney+ = select,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["Max"] = "Max = select,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["TikTok"] = "TikTok = select,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["Spotify"] = "Spotify = select,DIRECT,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["Telegram"] = "Telegram = select,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["Twitter"] = "Twitter = select,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["Facebook"] = "Facebook = select,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["PayPal"] = "PayPal = select,DIRECT,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["Amazon"] = "Amazon = select,DIRECT,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["苹果服务"] = "苹果服务 = select,DIRECT,PROXY,use=true,policy-regex-filter=.*,policy-select-name=DIRECT"
              groups["谷歌服务"] = "谷歌服务 = select,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["微软服务"] = "微软服务 = select,DIRECT,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
              groups["哔哩哔哩"] = "哔哩哔哩 = select,DIRECT,PROXY,use=true,policy-regex-filter=.*,policy-select-name=DIRECT"
              groups["游戏平台"] = "游戏平台 = select,DIRECT,PROXY,use=true,policy-regex-filter=.*,policy-select-name=PROXY"
            }
            {
              if ($0 == "[Proxy Group]") {
                print
                print groups["MissAV"]
                next
              }
              separator = index($0, " = ")
              name = separator > 0 ? substr($0, 1, separator - 1) : ""
              if (name == "MissAV") {
                next
              }
              if (name in groups) {
                print groups[name]
                next
              }
              print
            }
          ' lazy_group.conf > lazy_group.conf.tmp
          mv lazy_group.conf.tmp lazy_group.conf
          if ! grep -Fqx "$ad_rule_set" lazy_group.conf; then
            awk -v line="$ad_rule_set" '{ print } /^\[Rule\]$/ { print line }' lazy_group.conf > lazy_group.conf.tmp
            mv lazy_group.conf.tmp lazy_group.conf
          fi
          if ! grep -Fqx "$missav_rule_set" lazy_group.conf; then
            awk -v line="$missav_rule_set" '{ print } /^\[Rule\]$/ { print line }' lazy_group.conf > lazy_group.conf.tmp
            mv lazy_group.conf.tmp lazy_group.conf
          fi
          if ! grep -Fqx "$missav_keyword_rule" lazy_group.conf; then
            awk -v line="$missav_keyword_rule" '{ print } /^\[Rule\]$/ { print line }' lazy_group.conf > lazy_group.conf.tmp
            mv lazy_group.conf.tmp lazy_group.conf
          fi
          if ! grep -Fqx "$kiro_rule_marker" lazy_group.conf; then
            awk '
              { print }
              /^# AI$/ {
                print ""
                print "# Kiro IDE / CLI（参考 youngtreebig-droid/Shadowrocket-Rules）"
                print "DOMAIN-SUFFIX,kiro.dev,PROXY"
                print "DOMAIN-SUFFIX,kiro.aws.dev,PROXY"
                print "DOMAIN-SUFFIX,shortbread.aws.dev,PROXY"
                print "DOMAIN-SUFFIX,q.eu-central-1.amazonaws.com,PROXY"
                print "DOMAIN-SUFFIX,q.us-east-1.amazonaws.com,PROXY"
                print "PROCESS-NAME,Kiro Helper (Plugin),PROXY"
                print "PROCESS-NAME,Kiro Helper,PROXY"
                print "PROCESS-NAME,kiro-cli-chat,PROXY"
                print ""
              }
            ' lazy_group.conf > lazy_group.conf.tmp
            mv lazy_group.conf.tmp lazy_group.conf
          fi
        
      - name: Remove commits
        run: |
          cd release || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan latest_branch
          git add -A
          git commit -am "Nightly build"
          git branch -D release
          git branch -m release
          git push -f origin release
