name: Release Shadowrocket Rules

on:
  schedule:
    # 每日8时开始
    - cron:  '0 23 * * *'
  
  push:
    branches:
      - build
    paths-ignore: 
      - '**.md'
      - 'LICENSE'
      
  pull_request_target:
    branches:
      - build
    paths-ignore: 
      - '**.md'
      - 'LICENSE'

  workflow_dispatch:
  
jobs:
  Release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build
          path: build

      - uses: actions/checkout@v4
        with:
          ref: release
          path: release

      - uses: actions/checkout@v4
        with:
          ref: youngtreebig-droid-lazy-group-adblock
          path: source

      - name: Install requirements
        run: pip3 install -r build/requirements.txt

      - name: Build Rules
        run: |
          cd build || exit 1
          ./factory/auto_build.sh
      
      - name: Move files
        run: |
          cd build || exit 1
          for f in *.conf; do
            case "$f" in
              lazy.conf|lazy_group.conf) ;;
              *)
                cp "$f" ../source/
                cp "$f" ../release/
                ;;
            esac
          done
          cp -r figure ../source/
          cp -r figure ../release/
          cp LICENSE ../source/
          cp LICENSE ../release/

      - name: Update lazy rules
        run: |
          cd source || exit 1
          ad_rule_set='RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Advertising/Advertising.list,REJECT'
          antiad_domain_set='DOMAIN-SET,https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt,REJECT'
          missav_rule_set='RULE-SET,https://raw.githubusercontent.com/ddranic/ios-proxy-rules/master/geosite/shadowrocket/missav.list,MissAV'
          missav_keyword_rule='DOMAIN-KEYWORD,missav,MissAV'
          if ! grep -Fqx "$ad_rule_set" lazy_group.conf; then
            awk -v line="$ad_rule_set" '{ print } /^\[Rule\]$/ { print line }' lazy_group.conf > lazy_group.conf.tmp
            mv lazy_group.conf.tmp lazy_group.conf
          fi
          if ! grep -Fqx "$antiad_domain_set" lazy_group.conf; then
            awk -v line="$antiad_domain_set" '{ print } /^\[Rule\]$/ { print line }' lazy_group.conf > lazy_group.conf.tmp
            mv lazy_group.conf.tmp lazy_group.conf
          fi
          if ! grep -Fqx "$missav_rule_set" lazy_group.conf; then
            awk -v line="$missav_rule_set" '{ print } /^\[Rule\]$/ { print line }' lazy_group.conf > lazy_group.conf.tmp
            mv lazy_group.conf.tmp lazy_group.conf
          fi
          if ! grep -Fqx "$missav_keyword_rule" lazy_group.conf; then
            awk -v line="$missav_keyword_rule" '{ print } /^\[Rule\]$/ { print line }' lazy_group.conf > lazy_group.conf.tmp
            mv lazy_group.conf.tmp lazy_group.conf
          fi
          cp readme.md ../release/
          cp lazy.conf lazy_group.conf ../release/

      - name: Commit to default branch
        run: |
          cd source || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No changes for default branch"
          else
            git commit -m "Nightly build"
            git push origin HEAD:youngtreebig-droid-lazy-group-adblock
          fi

      - name: Remove commits
        run: |
          cd release || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan latest_branch
          git add -A
          git commit -am "Nightly build"
          git branch -D release
          git branch -m release
          git push -f origin release
