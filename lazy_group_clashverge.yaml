# ============================================================================
# Clash Verge Rev「扩展覆写配置」(Extend Config / Merge)，由 lazy_group.conf 转换而来
# 精简版：移除所有地区节点分组，仅保留一个「节点选择」默认分组
# ============================================================================
# 用法：
#   右键要应用的机场订阅卡片 -> "编辑扩展配置"（旧版界面可能显示为
#   "扩展覆写配置"）-> 这是一个纯 YAML 文本框 -> 全选删除 -> 粘贴本文件
#   全部内容 -> 保存。就这一步，不需要再碰"编辑规则"/"编辑代理组"。
#
# ⚠️ 重要：这会整份替换该订阅当前的 proxy-groups 和 rules。
#   Clash Verge 的合并逻辑是：先应用该订阅"编辑规则"/"编辑代理组"里的
#   前置/后置条目，然后才应用这里的"扩展覆写配置"；本文件下面的
#   proxy-groups/rules 是普通字段（不是 prepend-rules 这类特殊字段，那些
#   在当前版本里已不生效），所以会整份覆盖掉前一步的结果——包括你在
#   "编辑规则"/"编辑代理组"里手动加过的条目，以及订阅自带的默认分组/规则。
#   rule-providers 例外：它是按 key 合并的，不会覆盖订阅原有的规则集。
#
#   应用前请先打开该订阅的"编辑规则"看一眼，如果有你想保留的条目
#   （尤其是给自己代理服务器/订阅地址做直连的 IP-CIDR、DOMAIN-SUFFIX 之类
#   的绕过规则，不保留可能导致连不上自己的订阅/面板），把这些行复制到下面
#   rules 列表的最前面（MATCH 那条必须始终留在最后一行）再保存。
# ============================================================================
#
# 【本版本设计说明】
#   - 已删除全部地区节点分组（香港/台湾/日本/新加坡/韩国/美国）。
#   - 「节点选择」是你的默认节点分组：include-all 会列出订阅里全部节点，
#     在这里手动选一个，即作为所有服务的默认出口。
#   - 每个服务分组第一项都是「节点选择」（默认跟随你选的默认节点），
#     同时带 include-all，展开后也可为该服务单独选到订阅里的任意节点。

proxy-groups:
  # ---------- 默认节点分组：在这里手动选择默认使用的节点 ----------
  # include-all 列出订阅中的全部节点。所有服务默认都跟随这里选中的节点。
  # 如需排除无效/测试节点，可取消下面 filter 的注释并自定义正则，例如：
  # filter: "^((?!(过期|官网|流量)).)*$"
  - name: 节点选择
    type: select
    include-all: true

  # ---------- 服务分组：默认走「节点选择」，也可展开为该服务单独选任意节点 ----------
  # 默认策略（proxies 第一项）与原 conf 保持一致（DIRECT 优先的仍保留 DIRECT）。
  - name: AI
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: MissAV
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: YouTube
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: Netflix
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: "Disney+"
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: Max
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: TikTok
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: Spotify
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: Telegram
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: Twitter
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: Facebook
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: Instagram
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: PayPal
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: Amazon
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: 苹果服务
    type: select
    include-all: true
    proxies: [DIRECT, 节点选择]
  - name: 谷歌服务
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: 微软服务
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]
  - name: 哔哩哔哩
    type: select
    include-all: true
    proxies: [DIRECT, 节点选择]
  - name: 游戏平台
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]

  # ---------- 兜底分组：没有命中任何规则的"漏网之鱼"流量走这里 ----------
  # 规则列表最后一行 MATCH,漏网之鱼 会把所有未被前面规则命中、且不是 CN IP
  # 的流量导到这个分组。默认跟随「节点选择」，也可单独为兜底流量选任意节点/直连。
  # 这样兜底去向在分组面板里一目了然，不再是"看不见的默认行为"。
  - name: 漏网之鱼
    type: select
    include-all: true
    proxies: [节点选择, DIRECT]

